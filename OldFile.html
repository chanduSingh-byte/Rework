<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rework Entry Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px 0;
        margin: 0;
      }

      .container {
        max-width: 1650px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #007bff, #28a745, #ffc107, #dc3545);
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h2 {
        background: linear-gradient(135deg, #007bff, #0056b3);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        font-size: 2.2rem;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      .section-title {
        color: #2c3e50;
        font-weight: 600;
        margin: 30px 0 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #007bff;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.3rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-label {
        font-weight: 600;
        color: #495057;
        margin-bottom: 8px;
        display: block;
      }

      .form-control,
      .form-select {
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 12px 15px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: #fafbfc;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.15);
        background: #fff;
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, #28a745, #20c997);
        border: none;
        border-radius: 15px;
        padding: 15px 30px;
        font-size: 1.1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 10px 25px rgba(40, 167, 69, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(40, 167, 69, 0.4);
      }

      /* Skeleton */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: skeletonLoad 1.5s infinite;
        border-radius: 8px;
        height: 45px;
        margin: 5px 0;
      }

      .skeleton-sm {
        height: 35px;
      }

      @keyframes skeletonLoad {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* Loading Overlay */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(5px);
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 1.2rem;
        color: #007bff;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .container {
          margin: 10px;
          padding: 20px;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }
        .header h2 {
          font-size: 1.8rem;
        }
      }
      .btn-custom-gradient {
        background: linear-gradient(135deg, #6e8efb, #a777e3);
        color: #ffffff;
        border: none;
        border-radius: 50px;
        padding: 12px 35px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 15px rgba(167, 119, 227, 0.4);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .btn-custom-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(167, 119, 227, 0.6);
        color: #ffffff;
      }

      .btn-custom-gradient:active {
        transform: translateY(1px);
      }
    </style>
  </head>

  <body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">
        Data is Loading <i class="fas fa-cog fa-spin"></i>
      </div>
    </div>

    <div class="container" id="mainContainer" style="display: none">
      <div class="header">
        <h2><i class="fas fa-tools"></i> ChandanSingh...</h2>
        <p class="text-muted mt-2">Quality Control &amp; Rework Management</p>
      </div>

      <form id="reworkForm">
        <h4 class="section-title">
          <i class="fas fa-info-circle"></i> Basic Details
        </h4>
        <div class="form-grid" id="basicDetails">
          <!-- Skeleton placeholders -->
          <div><div class="skeleton"></div></div>
          <div><div class="skeleton"></div></div>
          <div><div class="skeleton"></div></div>
          <div><div class="skeleton"></div></div>
          <div><div class="skeleton"></div></div>
        </div>

        <h4 class="section-title"><i class="fas fa-bug"></i> Defect Details</h4>
        <div id="defectCards" class="row g-3"></div>

        <div class="text-center mt-3">
          <button type="button" id="loadMoreBtn" class="btn-custom-gradient">
            Load More
          </button>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4">
          <i class="fas fa-paper-plane"></i> Submit Rework Data
        </button>
      </form>
    </div>

    <script>
      // ── API endpoints ──────────────────────────────────────────────────────
      const REWORK_API =
        "https://script.google.com/macros/s/AKfycbzrHHhIQrEbZvri7jTCWnHyiks7dmdu3J0AWP60urR92jQ65qOo4fW4rAR1UpZOh_qt/exec?action=rework";
      const DEFECT_ITEMS_API =
        "https://script.google.com/macros/s/AKfycbxSNBFakZWs2H6ewqwg6Gzvng3r2_fPQ-eBSxUCNeqS6tCfAllypGTjoYxSJLU61TTg/exec?action=getDefectItems";
      const DEFECT_SOLUTION_API =
        "https://script.google.com/macros/s/AKfycbxxt6cOiwT9NLDXHhG44KrjwtX5-OlEe-2zsfxaBiJMOzEs8oI83jJ_mcSOxQ3JwkX0/exec?action=defect";

      // ── State ──────────────────────────────────────────────────────────────
      const TOTAL_CARDS = 12; 
      const CARDS_STEP = 3;
      let visibleCards = CARDS_STEP;

      let reworkData = [];
      let defectsData = [];
      let defectSolutionData = [];

      // ── Helpers ────────────────────────────────────────────────────────────
      function buildDefectOptions() {
        return (
          '<option value="">Select Defect</option>' +
          defectsData.map((d) => `<option value="${d}">${d}</option>`).join("")
        );
      }

      // ── Render defect cards (idempotent – always rebuilds from scratch) ────
      function renderCards() {
        const container = document.getElementById("defectCards");
        const options = buildDefectOptions();
        let html = "";

        for (let i = 1; i <= TOTAL_CARDS; i++) {
          const hidden = i > visibleCards ? "d-none" : "";
          html += `
            <div class="col-md-4 ${hidden}" id="card_${i}">
              <div class="card shadow h-100">
                <div class="card-body">
                  <h6 class="fw-bold text-primary mb-2">Defect #${i}</h6>
                  <select  name="defect_${i}"    class="form-select defect-select mb-2" data-row="${i}">${options}</select>
                  <input   type="number" name="qty_${i}"        class="form-control mb-2" placeholder="Qty">
                  <input   type="text"   name="orp_${i}"        class="form-control mb-2" placeholder="ORP">
                  <input   type="text"   name="obs_${i}"        class="form-control mb-2" placeholder="Observation">
                  <textarea              name="solution_${i}"   id="solution_${i}" class="form-control mb-2" rows="3" readonly placeholder="Solution (auto-filled)"></textarea>
                  <input   type="number" name="ok_${i}"         class="form-control mb-2" placeholder="OK">
                  <input   type="number" name="not_ok_${i}"     class="form-control mb-2" placeholder="Not OK">
                  <input   type="text"   name="rework_obs_${i}" class="form-control mb-2" placeholder="Rework Observation">
                  <input   type="text"   name="check_by_${i}"   class="form-control mb-2" placeholder="Check By">
                  <input   type="text"   name="rework_by_${i}"  class="form-control mb-2" placeholder="Rework By">
                </div>
              </div>
            </div>`;
        }

        container.innerHTML = html;
        attachDefectEvents();
        updateLoadMoreBtn();
      }

      function updateLoadMoreBtn() {
        const btn = document.getElementById("loadMoreBtn");
        btn.style.display =
          visibleCards >= TOTAL_CARDS ? "none" : "inline-block";
      }

      // ── Auto-fill solution when a defect is picked ─────────────────────────
      function attachDefectEvents() {
        document.querySelectorAll(".defect-select").forEach((select) => {
          select.addEventListener("change", function () {
            const row = this.dataset.row;
            const selected = this.value.trim().toLowerCase();
            const field = document.getElementById(`solution_${row}`);

            const matches = defectSolutionData.filter(
              (d) => d.defect.trim().toLowerCase() === selected,
            );

            field.value = matches.length
              ? matches.map((m, i) => `${i + 1}. ${m.solution}`).join("\n")
              : "";
          });
        });
      }

      // ── Render basic-details section ──────────────────────────────────────
      // function renderBasicDetails() {
      //   const options = '<option value="">📋 Select Hold No</option>' +
      //     reworkData.map(item =>
      //       `<option value="${item["Hold Number"]}">${item["Hold Number"]}</option>`

      //     </div>

      //       <input type="number" name="jrc_total" class="form-control" placeholder="0" disabled>

      //       <input type="number" name="jrc_Ok" class="form-control" placeholder="0" disabled>
      //     </div>

      //     <div>

      //       <input type="number" name="rework_qty" class="form-control" placeholder="0" disabled>
      //     </div>

      //   // Attach hold-no change AFTER element is in DOM
      //   document.getElementById("hold_no").addEventListener("change", function () {
      //     const data = reworkData.find(d => d["Hold Number"] == this.value);
      //     if (data) {

      //       document.querySelector("[name='jrc_Ok']").value =     data["Ok Qty"]      || "";

      function renderBasicDetails() {
        const options =
          '<option value="">📋 Select Hold No</option>' +
          reworkData
            .map(
              (item) =>
                `<option value="${item["Hold Number"]}">${item["Hold Number"]}</option>`,
            )
            .join("");

        document.getElementById("basicDetails").innerHTML = `
    <div>
      <label class="form-label">📦 Hold No</label>
      <select name="hold_no" id="hold_no" class="form-select" required>
        ${options}
      </select>
    </div>

    <div>
      <label class="form-label">⚙️ Hold Process</label>
      <input type="text" name="process" class="form-control" placeholder="Auto-selected process" readonly>
    </div>

    <div>
      <label class="form-label">📄 Item Code</label>
      <input type="text" name="item_code" class="form-control" placeholder="Auto-selected item code" readonly>
    </div>

    <div>
      <label class="form-label">📊 JRC Total</label>
      <input type="number" name="jrc_total" class="form-control" placeholder="Auto-filled total qty" readonly>
    </div>

    <div>
      <label class="form-label">📊 JRC OK QTY</label>
      <input type="number" name="jrc_Ok" class="form-control" placeholder="Auto-filled OK qty" readonly>
    </div>

    <div>
      <label class="form-label">🔧 Rework Qty</label>
      <input type="number" name="rework_qty" class="form-control" placeholder="Auto-filled rework qty" readonly>
    </div>

    <div>
      <label class="form-label">❌ Defect</label>
      <input type="text" name="Defect" class="form-control" placeholder="Auto-filled defect" readonly>
    </div>

    <div>
      <label class="form-label">📝 Remark</label>
      <textarea name="Remark" class="form-control"
          style="width:600px;" 
      " rows="3" placeholder="Auto-filled remark will appear here" readonly></textarea>
    </div>
  `;

        // Event listener
        document
          .getElementById("hold_no")
          .addEventListener("change", function () {
            const data = reworkData.find(
              (d) => String(d["Hold Number"]) === this.value,
            );

            if (data) {
              document.querySelector("[name='process']").value =
                data?.["Process Name"] ?? "";
              document.querySelector("[name='item_code']").value =
                data?.["Part"] ?? "";
              document.querySelector("[name='jrc_total']").value =
                data?.["JRC--Qty"] ?? "";
              document.querySelector("[name='jrc_Ok']").value =
                data?.["Ok Qty"] ?? "";
              document.querySelector("[name='rework_qty']").value =
                data?.["Rej Qty"] ?? "";
              document.querySelector("[name='Defect']").value =
                data?.["Defect Item"] ?? "";
              document.querySelector("[name='Remark']").value =
                data?.["Remark"] ?? "";
            }
          });
      }

      // ── Load More button ──────────────────────────────────────────────────
      document.getElementById("loadMoreBtn").addEventListener("click", () => {
        const prev = visibleCards;
        visibleCards = Math.min(visibleCards + CARDS_STEP, TOTAL_CARDS);

        // Reveal newly visible cards
        for (let i = prev + 1; i <= visibleCards; i++) {
          document.getElementById(`card_${i}`)?.classList.remove("d-none");
        }

        updateLoadMoreBtn();
      });

      // ── Submit ─────────────────────────────────────────────────────────────
      document
        .getElementById("reworkForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const submitBtn = this.querySelector('button[type="submit"]');
          const originalHTML = submitBtn.innerHTML;

          // Button ko loading state me dalo
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Submitting...';
          submitBtn.disabled = true;

          // Form ka poora data extract karke object me badlo
          const data = Object.fromEntries(new FormData(this).entries());
          console.log("📤 Submitting to Server:", data);

          try {
            // 🚀 Node.js Backend par Asali API Call
            const response = await fetch(
              "http://localhost:3000/api/save-rework",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json", // Backend ko batane ke liye ki data JSON format me hai
                },
                body: JSON.stringify(data), // Object ko JSON string me convert karke bhej rahe hain
              },
            );

            const result = await response.json();

            if (response.ok) {
              // ✅ Success: Data save ho gaya
              submitBtn.innerHTML =
                '<i class="fas fa-check"></i> Submitted Successfully!';
              submitBtn.className = "btn btn-success w-100 mt-4";
              this.reset(); // Submit hone ke baad form empty kar dega
            } else {
              // ❌ Server ne error diya (jaise database error)
              throw new Error(result.error || "Submission failed");
            }
          } catch (error) {
            // ❌ Network error ya Backend down ho toh
            console.error("Submission failed:", error);
            submitBtn.innerHTML =
              '<i class="fas fa-times"></i> Failed to Submit';
            submitBtn.className = "btn btn-danger w-100 mt-4";
          } finally {
            // 3 seconds ke baad button ko wapas normal kar do
            setTimeout(() => {
              submitBtn.innerHTML = originalHTML;
              submitBtn.className = "btn btn-primary w-100 mt-4";
              submitBtn.disabled = false;
            }, 3000);
          }
        });

      // ── Bootstrap (entry point) ───────────────────────────────────────────
      async function loadAllData() {
        try {
          const [reworkRes, defectsRes, solutionRes] = await Promise.all([
            fetch(REWORK_API),
            fetch(DEFECT_ITEMS_API),
            fetch(DEFECT_SOLUTION_API),
          ]);

          reworkData = await reworkRes.json();
          console.log("Rework Data:", reworkData);
          defectsData = await defectsRes.json();
          const solutionJson = await solutionRes.json();
          defectSolutionData = solutionJson.data; // API returns { data: [...] }

          renderBasicDetails(); // ① basic details + hold-no listener
          renderCards(); // ② defect cards + defect listeners

          // Reveal UI
          setTimeout(() => {
            document.getElementById("loadingOverlay").style.display = "none";
            document.getElementById("mainContainer").style.display = "block";
          }, 500);
        } catch (err) {
          console.error("Load error:", err);
          document.getElementById("loadingOverlay").innerHTML = `
            <div style="text-align:center;color:#dc3545">
              <i class="fas fa-exclamation-triangle" style="font-size:4rem;margin-bottom:20px"></i>
              <h3>Failed to load data</h3>
              <p>Please check your connection and refresh</p>
              <button class="btn btn-primary" onclick="location.reload()">
                <i class="fas fa-redo"></i> Retry
              </button>
            </div>`;
        }
      }

      loadAllData();
    </script>
  </body>
</html>
